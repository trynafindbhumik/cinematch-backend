#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"

[build]
  entrypoint = ["./tmp/api"]
  cmd = "go build -o ./tmp/api ./cmd/api"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", ".git", "docs", "scripts"]
  exclude_regex = ["_test.go", "_mock.go"]
  include_ext = ["go", "yaml", "yml", "json", "toml", "env"]
  stop_on_error = false

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false